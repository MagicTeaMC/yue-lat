<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}QuickGo{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <meta name="description" content="{% block description %}A fast, lightweight URL shortener built with Rust. {% endblock %}">
    <meta name="keywords" content="url shortener, short links, link shortener, rust, fast">
    <meta name="author" content="Maoyue">
    <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}QuickGo{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A fast, lightweight URL shortener built with Rust.{% endblock %}">
    <meta property="og:site_name" content="QuickGo">
    <meta property="og:locale" content="en_US">
    
    <meta property="twitter:title" content="{% block twitter_title %}QuickGo{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}A fast, lightweight URL shortener built with Rust.{% endblock %}">
    
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark">
    
    
    {% block page_metadata %}{% endblock %}
    
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #1a1a1a; color-scheme: dark; color: #e0e0e0; }
        input, button, select { border-radius: 4px; }
        altcha-widget { --altcha-border-radius: 0; --altcha-checkbox-border-radius: 0; --altcha-shadow: none; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #404040; box-sizing: border-box; background: #2a2a2a; color: #e0e0e0; }
        input:focus { outline: none; border-color: #007bff; }
        button { background: #007bff; color: white; padding: 0.5rem 1rem; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 1rem; padding: 1rem; background: #252525; word-break: break-all; }
        .footer { margin-top: 2rem; text-align: center; padding-top: 1rem; border-top: 1px solid #404040; }
        .social-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 0.5rem; }
        .social-links a { color: #007bff; text-decoration: none; padding: 0.5rem; transition: background-color 0.2s; }
        .social-links a:hover { background-color: #2a2a2a; }
        .social-links a::before { margin-right: 0.5rem; }
        .github::before { content: "🐙"; }
        .contact::before { content: "💬"; }
        .donate::before { content: "🧡"; }
        a { color: #4da6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .top-nav { display: flex; align-items: end; gap: clamp(0.15rem, 1vw, 0.3rem); border-bottom: 1px solid #3f4957; margin-bottom: clamp(1.25rem, 5vw, 1.75rem); }
        .top-nav a { display: flex; align-items: center; min-height: 2.5rem; margin-bottom: -1px; padding: 0 clamp(0.4rem, 2vw, 0.8rem); border-top: 2px solid transparent; border-bottom: 1px solid transparent; background: #242a32; color: #becbd9; white-space: nowrap; font-size: 0.875rem; font-weight: 600; }
        .top-nav a:hover { background: #2c3643; color: #fff; text-decoration: none; }
        .top-nav a[aria-current="page"] { background: #1a1a1a; border-top-color: #78aee9; border-bottom-color: #1a1a1a; color: #e7f2ff; }
        .top-nav a:focus-visible { position: relative; outline: 2px solid #7dbbff; outline-offset: 2px; }
        .secondary-action { display: inline-block; padding: 0.5rem 0.75rem; border: 1px solid #454d59; background: #22262c; color: #e5edf7; font: inherit; font-size: 0.875rem; font-weight: 600; }
        .secondary-action:hover { background: #303842; color: #fff; text-decoration: none; }
        .secondary-action:focus-visible { outline: 2px solid #7dbbff; outline-offset: 3px; }
        .error { background: #3a1f1f; color: #ff6b6b; padding: 1rem; border-inline-start: 2px solid #ff6b6b; }
        h1 { margin-top: 0; }
        h2 { color: #4da6ff; margin-top: 2rem; }
        h3 { color: #5db3ff; margin-top: 1.5rem; }
        h4 { color: #7dc5ff; margin-top: 1rem; margin-bottom: 0.5rem; }
        code { background: #2a2a2a; padding: 0.2rem 0.4rem; font-family: 'Courier New', monospace; }
        pre { overflow-x: auto; }
        table { color: #e0e0e0; }
        ul { line-height: 1.6; }
    </style>
</head>
<body>
    <nav class="top-nav" aria-label="QuickGo">
        <a href="/" {% block nav_home %}{% endblock %}>Home</a>
        <a href="/edit" {% block nav_edit %}{% endblock %}>Manage</a>
        <a href="/api/v1" {% block nav_docs %}{% endblock %}>API Docs</a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    
    <div class="footer">
        {% block footer_notice %}{% endblock %}
        <div>Made with 🦀 Rust and ❤️</div>
        <div class="social-links">
            <a href="https://ko-fi.com/maoyue" class="donate" target="_blank" rel="noopener noreferrer">Donate</a>
            <a href="https://github.com/MagicTeaMC/quickgo" class="github" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://maoyue.tw/#contact" class="contact" target="_blank" rel="noopener noreferrer">Contact</a>
        </div>
    </div>
</body>
</html>
