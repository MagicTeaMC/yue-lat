{% extends "base.html" %}
{% block page_metadata %}
<link rel="canonical" href="{{ base_url }}/">
<meta property="og:url" content="{{ base_url }}/">
<meta property="twitter:url" content="{{ base_url }}/">
{% endblock %}
{% block footer_notice %}{% include "report_abuse.html" %}{% endblock %}
{% block content %}
<h1>QuickGo</h1>
<script type="module" src="/static/altcha.min.js"></script>
<script defer src="/static/expiration.js"></script>
<form method="post" id="shorten-form">
    <input type="url" name="url" placeholder="https://example.com/very/long/url" required>
    <details>
        <summary>Link options</summary>
        <label for="expires-at">Expiration (optional, <span id="expiration-zone">UTC</span>)</label>
        <input id="expires-at" type="datetime-local" name="expires_at" step="1">
        <label for="max-visits">Maximum uses (optional)</label>
        <input id="max-visits" type="number" name="max_visits" min="1" step="1">
        <label for="password">Visitor password (optional, 8 characters minimum, 128 bytes maximum)</label>
        <input id="password" type="password" name="password" autocomplete="off">
    </details>
    {% include "form_security.html" %}
    <button type="submit" id="submit-btn" disabled>Shorten</button>
</form>
<p><a href="/edit">Manage a link</a></p>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const submitBtn = document.getElementById('submit-btn');
        const form = document.getElementById('shorten-form');
        const altchaWidget = document.querySelector('altcha-widget');
        
        if (altchaWidget) {
            altchaWidget.addEventListener('statechange', (event) => {
                if (event.detail.state === 'verified') {
                    submitBtn.disabled = false;
                } else {
                    submitBtn.disabled = true;
                }
            });
        }
        
        form.addEventListener('submit', function(e) {
            if (submitBtn.disabled) {
                e.preventDefault();
                alert('Please complete the verification first');
            }
        });
    });
</script>
{% endblock %}
