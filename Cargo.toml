[package]
name = "quickgo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "quickgo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
sha2 = "0.11.1"
base16ct = { version = "1.0.0", features = ["alloc"] }
axum = "0.8.9"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
dotenvy = "0.15.7"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tower = "0.5.3"
anyhow = "1.0.104"
axum_csrf = { version = "0.12.0", features = ["layer"] }
http = "1.5.0"
url = "2.5.8"
serde_json = "1.0.154"
altcha-lib-rs = { version = "0.3.3", features = ["json"] }
chrono = "0.4.45"
base64 = "0.23.1"
argon2 = "0.5.3"
